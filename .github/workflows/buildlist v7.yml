name: Build Symbol List v7

on:
  workflow_dispatch:

permissions:
  contents: write

# Chỉ cho chạy 1 bot tại 1 thời điểm (tránh xung đột getUpdates của Telegram)
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Không còn vnstock / vnstock-oapi: gọi thẳng TCBS OpenAPI qua tcbs_common.py
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pandas numpy requests "python-telegram-bot==20.7"
          python -c "import pandas, requests, telegram; print('deps OK')"

      - name: Run buildlist_v7.py
        run: python buildlist_v7.py
        env:
          TCBS_API_KEY: ${{ secrets.TCBS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_WORKERS: '10'
          RATE_PER_MIN: '240'   # số request/phút gửi tới TCBS, hạ xuống nếu bị 429

      - name: Commit vn_stocks_full.txt
        if: success()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add vn_stocks_full.txt || true
          git diff --cached --quiet && echo 'No changes' && exit 0
          git commit -m 'Auto update vn_stocks_full.txt'
          git pull --rebase origin main
          git push origin main
