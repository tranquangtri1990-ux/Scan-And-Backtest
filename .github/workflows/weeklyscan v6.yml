name: Weekly Scan v6

on:
  workflow_dispatch:

# Chỉ cho chạy 1 bot tại 1 thời điểm (tránh xung đột getUpdates của Telegram)
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # vnstock 6: cài từ kho vnstocks.com, luôn ghi rõ dải phiên bản.
      # Không cần vnstock.login / VNSTOCK_API_KEY cho Market & Reference.
      - name: Install dependencies (vnstock 6)
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -U --extra-index-url https://vnstocks.com/api/packages "vnstock>=6.0.0,<7" "vnstock-oapi>=0.1.0,<1"
          .venv/bin/pip install pandas numpy requests "python-telegram-bot==20.7"
          .venv/bin/vnstock version
          .venv/bin/python -c "from vnstock import Market; import vnstock_oapi; print('vnstock 6 OK')"
          .venv/bin/python -c "import telegram; print('telegram OK')"

      - name: Run weeklyscan_v6.py
        run: .venv/bin/python weeklyscan_v6.py
        env:
          TCBS_API_KEY: ${{ secrets.TCBS_API_KEY }}
          # runner không có keyring -> lưu token phiên TCBS vào tệp (quyền 600)
          VNSTOCK_OAPI_SESSION_BACKEND: file
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload TXT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket_qua_weekly_v6
          path: ket_qua_weekly_*.txt
          if-no-files-found: ignore
