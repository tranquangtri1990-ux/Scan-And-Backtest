name: Backtest Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Cache vnstock device registration
        id: vnstock-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.vnstock
            ~/.config/vnstock
            /home/runner/.vnstock
            /home/runner/.config/vnstock
            /home/runner/.venv
          key: vnstock-device-${{ runner.os }}
          restore-keys: |
            vnstock-device-

      - name: Ensure venv exists with core deps (trước khi cài vnai/vnii)
        run: |
          python -m venv /home/runner/.venv || true
          /home/runner/.venv/bin/pip install --upgrade pip
          /home/runner/.venv/bin/pip install pandas numpy requests

      - name: Install pip prerequisites (required by installer's own verification step)
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests

      - name: Check if vnstock-cli already installed (from cache)
        id: check_vnstock
        run: |
          if [ -x "/home/runner/.venv/bin/python" ] && \
             /home/runner/.venv/bin/python -c "from vnstock import Vnstock" 2>/dev/null && \
             [ -f "/home/runner/.vnstock/.installed_ok" ]; then
            echo "Đã có sẵn vnstock-cli từ cache, bỏ qua bước cài đặt/đăng ký thiết bị."
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install vnstock-cli (with retry + fallback)
        if: steps.check_vnstock.outputs.cached != 'true'
        run: |
          set +e
          success=false
          for i in 1 2 3; do
            echo "== Thử cài vnstock-cli lần $i =="
            wget -q https://vnstocks.com/files/vnstock-cli-installer.run -O installer.run
            chmod +x installer.run
            ./installer.run -- --non-interactive --api-key "${{ secrets.VNSTOCK_API_KEY }}"
            if [ $? -eq 0 ]; then
              success=true
              break
            fi
            echo "Lần $i thất bại, chờ 20s rồi thử lại..."
            sleep 20
          done

          if [ "$success" != "true" ]; then
            echo "== Installer .run thất bại 3 lần, chuyển sang cài thủ công qua pip =="
            pip install --extra-index-url https://vnstocks.com/api/simple vnii vnstock_installer vnai --force
          fi

          mkdir -p /home/runner/.vnstock
          touch /home/runner/.vnstock/.installed_ok

      - name: Install dependencies
        run: |
          uv pip install --python /home/runner/.venv/bin/python \
            pandas numpy requests "python-telegram-bot==20.7"
          /home/runner/.venv/bin/python -c "import telegram; print('telegram OK')"
          /home/runner/.venv/bin/python -c "from vnstock import Vnstock; print('vnstock OK')"

      - name: Upload installer log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnstock-installer-log-backtest
          path: /home/runner/.vnstock/vnstock_installer.log
          if-no-files-found: ignore

      - name: Run Backtest Bot
        run: /home/runner/.venv/bin/python backtest_bot_v4_fixed.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket_qua_scanall
          path: ket_qua_scanall_*.csv
